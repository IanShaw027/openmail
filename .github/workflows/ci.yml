name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # Called by docker.yml / release.yml so a publish cannot outrun the tests.
  workflow_call:
    inputs:
      ref:
        description: "Git ref to test (tag, branch, or SHA). Empty uses github.sha."
        required: false
        type: string

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Pytest
        env:
          OPENMAIL_MASTER_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
        run: pytest -q

  lockfile:
    name: uv.lock is current
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: astral-sh/setup-uv@v5
      # A lock file that silently drifts from pyproject.toml is worse than none:
      # it looks like a reproducible build while resolving something else.
      - run: uv lock --check

  frontend:
    # Name is load-bearing: branch protection on main requires a check called
    # exactly "Frontend build". Renaming the job silently blocks every PR.
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx vue-tsc -p tsconfig.vitest.json --noEmit
      - run: npm run build
