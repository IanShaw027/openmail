name: Docker image

# Branch / PR builds only. Tagged releases are handled by release.yml
# (version sync + package + GitHub Release).

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  HUB_IMAGE: ianshaw027/openmail
  GHCR_IMAGE: ghcr.io/ianshaw027/openmail

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Read VERSION
        id: ver
        run: |
          if [ -f VERSION ]; then
            V=$(tr -d '[:space:]' <VERSION)
          else
            V="0.0.0-dev"
          fi
          echo "version=$V" >>"$GITHUB_OUTPUT"

      - name: Detect Docker Hub credentials
        id: hub
        if: github.event_name != 'pull_request'
        env:
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "enabled=true" >>"$GITHUB_OUTPUT"
          else
            echo "enabled=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Image list (GHCR always; Hub when secret set)
        id: images
        run: |
          {
            echo "list<<EOF"
            echo "${GHCR_IMAGE}"
            if [ "${{ github.event_name }}" != "pull_request" ] && [ "${{ steps.hub.outputs.enabled }}" = "true" ]; then
              echo "${HUB_IMAGE}"
            fi
            echo "EOF"
          } >>"$GITHUB_OUTPUT"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.images.outputs.list }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short
            type=ref,event=branch

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request' && steps.hub.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_USERNAME || 'ianshaw027' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (PR — no push)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          platforms: linux/amd64
          build-args: |
            OPENMAIL_VERSION=${{ steps.ver.outputs.version }}
          tags: openmail:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push (main — rolling)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            OPENMAIL_VERSION=${{ steps.ver.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
