name: Docker image

# Rolling Hub builds only when app/image sources change.
# Tagged releases (v*) are handled by release.yml (version sync + package + GH Release).
# PRs no longer build Docker images (saves Actions minutes; CI still covers tests/build).

on:
  push:
    branches: [main, master]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "backend/**"
      - "frontend/**"
      - "VERSION"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  HUB_IMAGE: ianshaw027/openmail

jobs:
  # Publishing `latest` straight off a push is how a broken image reached Docker
  # Hub before: nothing made the build wait for tests. This re-runs CI for the
  # commit being published, which duplicates the standalone CI run on main —
  # cheaper than shipping another image that crash-loops on start.
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  build:
    name: Build
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Read VERSION
        id: ver
        run: |
          if [ -f VERSION ]; then
            V=$(tr -d '[:space:]' <VERSION)
          else
            V="0.0.0-dev"
          fi
          echo "version=$V" >>"$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.HUB_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short
            type=ref,event=branch

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_USERNAME || 'ianshaw027' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (main — rolling)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            OPENMAIL_VERSION=${{ steps.ver.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
