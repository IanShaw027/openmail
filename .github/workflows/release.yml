name: Release

# On every v* tag: bake version into image, push Docker Hub, create GitHub Release.
# Requires repo secrets: DOCKERHUB_TOKEN (+ optional DOCKERHUB_USERNAME, default ianshaw027).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to re-publish (e.g. v0.1.0)"
        required: true
        type: string

env:
  HUB_IMAGE: ianshaw027/openmail

jobs:
  # Gate the publish on tests. On a tag push this runs against the tag itself;
  # a manual re-publish runs against whichever ref was dispatched, so pick the
  # tag there too if you want the check to mean anything.
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

  release:
    name: Package + GitHub Release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Resolve ref
        id: ref
        env:
          # Via env, never interpolated into the script body: `${{ inputs.tag }}`
          # is dispatcher-controlled text, and the validation below only runs
          # after the shell has already parsed whatever it expanded to.
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            REF="$INPUT_TAG"
          else
            REF="${GITHUB_REF_NAME}"
          fi
          case "$REF" in
            v*) ;;
            *) echo "tag must start with v: $REF" >&2; exit 1 ;;
          esac
          VERSION="${REF#v}"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.+-]+)?$'; then
            echo "invalid semver after v: $VERSION" >&2
            exit 1
          fi
          echo "tag=$REF" >>"$GITHUB_OUTPUT"
          echo "version=$VERSION" >>"$GITHUB_OUTPUT"
          echo "Resolved $REF → $VERSION"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.ref.outputs.tag }}
          fetch-depth: 0

      - name: Sync version into sources (image bake)
        run: bash scripts/sync-version.sh "${{ steps.ref.outputs.version }}"

      - name: Require Docker Hub credentials
        env:
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "DOCKERHUB_TOKEN secret is required to publish images." >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.HUB_IMAGE }}
          tags: |
            type=raw,value=v${{ steps.ref.outputs.version }}
            type=raw,value=${{ steps.ref.outputs.version }}
            type=raw,value=latest
            type=sha,prefix=,format=short
          labels: |
            org.opencontainers.image.title=OpenMail
            org.opencontainers.image.description=Local-first multi-source mail console
            org.opencontainers.image.version=${{ steps.ref.outputs.version }}
            org.opencontainers.image.source=https://github.com/IanShaw027/openmail

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_USERNAME || 'ianshaw027' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            OPENMAIL_VERSION=${{ steps.ref.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Generate release notes
        id: notes
        env:
          TAG: ${{ steps.ref.outputs.tag }}
          VERSION: ${{ steps.ref.outputs.version }}
        run: |
          NOTES="${RUNNER_TEMP}/release-notes.md"
          {
            echo "## OpenMail ${TAG}"
            echo
            echo "### Image (Docker Hub)"
            echo
            echo '```'
            echo "docker pull ${HUB_IMAGE}:${TAG}"
            echo "docker pull ${HUB_IMAGE}:latest"
            echo '```'
            echo
            echo "### Run"
            echo
            echo '```bash'
            echo "docker pull ${HUB_IMAGE}:${TAG}"
            echo "docker run -d --name openmail -p 8000:8000 \\"
            echo "  -e OPENMAIL_MASTER_KEY=\"\$(openssl rand -base64 32)\" \\"
            echo "  -v openmail-data:/data \\"
            echo "  ${HUB_IMAGE}:${TAG}"
            echo '```'
            echo
            echo "Or with compose from this repo: \`docker compose pull && docker compose up -d\`"
            echo
            echo "\`/api/health\` reports \`version: ${VERSION}\`."
            echo
            if [ -f CHANGELOG.md ]; then
              echo "### Changelog"
              echo
              awk -v ver="$VERSION" '
                BEGIN { p=0 }
                $0 ~ "^## " ver "$" || $0 ~ "^## \\[" ver "\\]" { p=1; next }
                p && /^## / { exit }
                p { print }
              ' CHANGELOG.md || true
            fi
          } >"$NOTES"
          echo "path=$NOTES" >>"$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ref.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file "${{ steps.notes.outputs.path }}" --latest
          else
            gh release create "$TAG" \
              --title "OpenMail ${TAG}" \
              --notes-file "${{ steps.notes.outputs.path }}" \
              --latest \
              --verify-tag
          fi
