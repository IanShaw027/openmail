[project]
name = "openmail-backend"
version = "0.1.0"
description = "OpenMail self-hosted multi-mailbox fetch console API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "cryptography>=43.0.0",
    "python-multipart>=0.0.12",
    "httpx>=0.27.0",
    "socksio>=1.0.0",
    # TLS fingerprint for mail.com cookie provider (graceful httpx fallback)
    "curl_cffi>=0.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    # Starlette TestClient backend (deprecation since starlette 1.3)
    "httpx2>=2.0.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "network: tests that hit live external services (skipped by default)",
]
